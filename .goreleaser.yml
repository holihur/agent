# .goreleaser.yml
# GoReleaser 配置: https://goreleaser.com

version: 2

project_name: agent

# 构建前钩子
before:
  hooks:
    - go mod tidy
    - go generate ./...

# 构建配置
builds:
  - id: agent
    main: ./cmd/agent
    binary: agent
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
      - "386"
    goarm:
      - "7"
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
      - -X main.builtBy=goreleaser

# 归档配置
archives:
  - id: agent
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        format: zip
    files:
      - LICENSE*
      - README*
      - docs/**/*

# 校验和配置
checksum:
  name_template: "checksums.txt"
  algorithm: sha256

# 快照配置(用于测试)
snapshot:
  name_template: "{{ incpatch .Version }}-next"

# Changelog 配置
changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch
  use: github

